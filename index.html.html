<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visammahu Muhammad — Program Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E3B36;
    --ink-deep:#082622;
    --gold:#C79A4B;
    --gold-soft:#E7CA8E;
    --ivory:#FAF5E8;
    --ivory-2:#F1E9D6;
    --maroon:#7E2B34;
    --paper:#FCFAF3;
    --line:rgba(14,59,54,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink-deep);
    font-family:'Jost',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 24px 80px;}

  /* ---- Header ---- */
  header{
    position:relative;
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-deep) 100%);
    color:var(--ivory);
    padding:56px 24px 46px;
    overflow:hidden;
    text-align:center;
  }
  .star-field{position:absolute;inset:0;opacity:.16;pointer-events:none;}
  .star{
    position:absolute;
    transform-origin:center;
    animation:spin 60s linear infinite;
  }
  .star.rev{animation-direction:reverse;animation-duration:90s;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .logo-plate{
    display:inline-block;
    background:var(--paper);
    border-radius:16px;
    padding:18px 30px 14px;
    margin:0 0 18px;
    box-shadow:0 10px 26px rgba(0,0,0,.22);
    opacity:0;
    transform:translateY(14px) scale(.96);
    animation:logoIn .8s cubic-bezier(.2,.7,.2,1) forwards .1s;
  }
  .logo-plate img{
    display:block;
    max-width:280px;
    width:60vw;
    height:auto;
  }
  @keyframes logoIn{to{opacity:1;transform:translateY(0) scale(1);}}
  .madrasa{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.04em;
    color:var(--ivory);
    margin:0 0 6px;
    opacity:0;
    animation:riseIn .9s ease forwards .34s;
  }
  .sub{
    font-size:15px;
    color:var(--gold-soft);
    margin:0;
    font-weight:300;
    letter-spacing:.02em;
    opacity:0;
    animation:riseIn .9s ease forwards .46s;
  }
  .rule{
    width:110px;height:1px;margin:22px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:0;
    animation:riseIn .9s ease forwards .6s;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Category tabs ---- */
  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:-26px 0 40px;
    position:relative;
    z-index:2;
  }
  .tab{
    font-family:'Jost',sans-serif;
    font-size:13.5px;
    letter-spacing:.04em;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    padding:12px 20px 10px;
    border-radius:3px 3px 14px 14px;
    cursor:pointer;
    position:relative;
    box-shadow:0 3px 10px rgba(14,59,54,.06);
    transition:transform .25s ease, box-shadow .25s ease, color .25s ease, background .25s ease;
  }
  .tab .count{
    display:block;
    font-family:'Amiri',serif;
    font-size:18px;
    color:var(--maroon);
    margin-top:2px;
  }
  .tab:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(14,59,54,.12);}
  .tab.active{
    background:var(--ink);
    color:var(--ivory);
    border-color:var(--ink);
  }
  .tab.active .count{color:var(--gold-soft);}

  /* ---- Section ---- */
  .section-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin:0 0 26px;
  }
  .section-head .ml{
    font-family:'Amiri',serif;
    font-size:26px;
    color:var(--ink);
  }
  .section-head .en{
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--maroon);
  }
  .section-head::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:16px;
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px 22px 18px;
    position:relative;
    opacity:0;
    transform:translateY(16px);
    animation:cardIn .55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .card::before{
    content:"";
    position:absolute;
    top:0;left:22px;right:22px;
    height:2px;
    background:linear-gradient(90deg,var(--gold),transparent 70%);
  }
  .card .no{
    font-family:'Amiri',serif;
    font-size:13px;
    color:var(--gold);
    letter-spacing:.06em;
  }
  .card h3{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:19px;
    margin:4px 0 14px;
    color:var(--ink-deep);
    line-height:1.3;
  }
  .win{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    font-size:14px;
    border-top:1px dashed var(--line);
  }
  .win:first-of-type{border-top:none;}
  .medal{
    width:22px;height:22px;
    flex:0 0 auto;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:11px;
    color:var(--paper);
  }
  .medal.g{background:var(--gold);}
  .medal.s{background:#9AA6A0;}
  .medal.b{background:#B8734B;}
  .win .name{color:var(--ink-deep);font-weight:500;}
  .win .meta{display:flex;flex-direction:column;line-height:1.35;}
  .win .team{color:#8A8676;font-size:11.5px;font-weight:400;letter-spacing:.02em;}

  .empty-row{font-size:13px;color:#8A8676;font-style:italic;padding:4px 0;}

  footer{
    text-align:center;
    padding:40px 0 0;
    font-size:12px;
    color:#9A9480;
    letter-spacing:.08em;
  }

  /* ---- Admin ---- */
  .admin-fab{
    position:fixed;
    right:20px;bottom:20px;
    background:var(--ink-deep);
    color:var(--ivory);
    border:none;
    border-radius:50%;
    width:48px;height:48px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
    z-index:50;
  }
  .admin-fab.on{background:var(--maroon);}
  .card{position:relative;}
  .card-actions{
    position:absolute;top:14px;right:14px;
    display:none;
    gap:6px;
  }
  .card.editable .card-actions{display:flex;}
  .icon-btn{
    width:24px;height:24px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:50%;
    font-size:12px;
    cursor:pointer;
    color:var(--ink);
    line-height:1;
  }
  .icon-btn.del{color:var(--maroon);}
  .add-card{
    border:1px dashed var(--gold);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    color:var(--maroon);
    font-size:14px;
    cursor:pointer;
    min-height:110px;
  }
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(8,38,34,.55);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal{
    background:var(--paper);
    border-radius:6px;
    padding:26px 26px 22px;
    width:100%;max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .modal h4{
    font-family:'Amiri',serif;
    margin:0 0 16px;
    font-size:19px;
    color:var(--ink-deep);
  }
  .modal label{
    display:block;
    font-size:12px;
    color:var(--maroon);
    letter-spacing:.04em;
    margin:12px 0 4px;
  }
  .modal input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:'Jost',sans-serif;
    font-size:14px;
    background:#fff;
  }
  .modal .row{display:flex;gap:16px;justify-content:flex-end;margin-top:20px;}
  .modal button{
    font-family:'Jost',sans-serif;
    font-size:13px;
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
  }
  .modal button.primary{
    background:var(--ink-deep);
    color:var(--ivory);
    border-color:var(--ink-deep);
  }
  .modal .err{color:var(--maroon);font-size:12px;margin-top:8px;display:none;}

  /* ---- Splash / opening ---- */
  #splash{
    position:fixed;inset:0;
    z-index:200;
    background:radial-gradient(120% 120% at 50% 20%,var(--ink) 0%,var(--ink-deep) 70%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    transition:opacity .7s ease, visibility .7s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-stars{position:absolute;inset:0;opacity:.18;pointer-events:none;overflow:hidden;}
  .splash-stars .star{position:absolute;transform-origin:center;animation:spin 70s linear infinite;}
  .splash-stars .star.a{left:6%;top:12%;width:120px;}
  .splash-stars .star.b{right:8%;top:18%;width:90px;animation-direction:reverse;animation-duration:50s;}
  .splash-stars .star.c{left:12%;bottom:10%;width:80px;animation-duration:85s;}
  .splash-stars .star.d{right:14%;bottom:14%;width:110px;animation-direction:reverse;animation-duration:60s;}
  .splash-logo{
    background:var(--paper);
    border-radius:20px;
    padding:22px 34px 18px;
    box-shadow:0 18px 44px rgba(0,0,0,.35);
    opacity:0;
    transform:translateY(24px) scale(.9);
    animation:splashLogoIn 1s cubic-bezier(.2,.7,.2,1) forwards .2s;
  }
  .splash-logo img{display:block;width:min(62vw,300px);height:auto;}
  @keyframes splashLogoIn{to{opacity:1;transform:translateY(0) scale(1);}}
  .splash-name{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:clamp(15px,3.6vw,19px);
    letter-spacing:.05em;
    color:var(--ivory);
    margin:26px 0 6px;
    opacity:0;
    animation:riseIn .8s ease forwards .9s;
  }
  .splash-tag{
    font-size:14px;
    color:var(--gold-soft);
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:0;
    opacity:0;
    animation:riseIn .8s ease forwards 1.15s;
  }
  .splash-rule{
    width:70px;height:1px;margin:20px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:0;
    animation:riseIn .8s ease forwards 1.35s;
  }
  .splash-hint{
    position:absolute;
    bottom:36px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:0;
    animation:hintIn 1s ease forwards 2.4s, pulse 1.8s ease-in-out infinite 3.4s;
  }
  @keyframes hintIn{to{opacity:.85;}}
  @keyframes pulse{0%,100%{opacity:.85;}50%{opacity:.35;}}
  #mainApp{
    opacity:0;
    transition:opacity .8s ease;
  }
  #mainApp.show{opacity:1;}
  .splash-count{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:var(--ink-deep);
  }
  .splash-count.on{display:flex;}
  .splash-count span{
    font-family:'Amiri',serif;
    font-weight:700;
    color:var(--gold-soft);
    font-size:96px;
    animation:countPop 1.1s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes countPop{
    0%{opacity:0;transform:scale(.4);}
    30%{opacity:1;transform:scale(1.12);}
    70%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.25);}
  }
</style>
</head>

    {no:39, title:"Malayalam speech", w:["Fida","Afsin","Farsana"]},
  ]},
  { key:"general", ml:"ജനറൽ", en:"General", items:[
    {no:40, title:"Mawlid", w:["Team Lam","Team Aleef","Team Meem"]},
    {no:41, title:"Mala", w:["Team Lam","Team Aleef","Team Meem"]},
    {no:42, title:"Quiz reality show", w:["Team Meem","Team Aleef","Team Lam"]},
  ]},
];

const ADMIN_PASSWORD = "123457";
const STORAGE_KEY = "program-results-data-v1";

let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
let activeKey = DATA[0].key;
let isAdmin = false;

const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');
const modalRoot = document.getElementById('modalRoot');
const adminFab = document.getElementById('adminFab');

function medalClass(i){ return i===0?'g':(i===1?'s':'b'); }
function medalLabel(i){ return i===0?'1':(i===1?'2':'3'); }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      DATA = JSON.parse(res.value);
    }
  }catch(e){
    /* no saved data yet, or storage unavailable — fall back to defaults */
  }
  buildTabs();
  render(activeKey);
}

async function saveData(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
  }catch(e){
    console.error('Could not save changes', e);
  }
}

function buildTabs(){
  tabsEl.innerHTML = '';
  DATA.forEach((cat) => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat.key===activeKey ? ' active' : '');
    btn.dataset.key = cat.key;
    btn.innerHTML = `${cat.en}<span class="count">${cat.items.length}</span>`;
    btn.addEventListener('click', () => selectCat(cat.key));
    tabsEl.appendChild(btn);
  });
}

function render(key){
  activeKey = key;
  const cat = DATA.find(c => c.key===key);
  contentEl.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `<span class="ml">${cat.ml}</span><span class="en">${cat.en}</span>`;
  contentEl.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  cat.items.forEach((it, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (isAdmin ? ' editable' : '');
    card.style.animationDelay = (i*0.05) + 's';
    let winsHtml = it.w.map((entry, wi) => {
      const w = (typeof entry === 'string') ? {name:entry, team:''} : entry;
      const teamHtml = w.team ? `<span class="team">${w.team}</span>` : '';
      return `<div class="win"><span class="medal ${medalClass(wi)}">${medalLabel(wi)}</span><span class="meta"><span class="name">${w.name}</span>${teamHtml}</span></div>`;
    }).join('');
    card.innerHTML = `
      <div class="card-actions">
        <button class="icon-btn edit" aria-label="Edit">&#9998;</button>
        <button class="icon-btn del" aria-label="Delete">&#10005;</button>
      </div>
      <span class="no">No. ${it.no}</span><h3>${it.title}</h3>${winsHtml}`;
    card.querySelector('.edit').addEventListener('click', () => openItemModal(cat.key, i));
    card.querySelector('.del').addEventListener('click', () => deleteItem(cat.key, i));
    grid.appendChild(card);
  });

  if(isAdmin){
    const addCard = document.createElement('div');
    addCard.className = 'card add-card';
    addCard.textContent = '+ Add program';
    addCard.addEventListener('click', () => openItemModal(cat.key, null));
    grid.appendChild(addCard);
  }

  contentEl.appendChild(grid);
}

function selectCat(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key===key));
  render(key);
}

function closeModal(){ modalRoot.innerHTML = ''; }

function openPasswordModal(){
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h4>Admin sign in</h4>
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="off" />
        <p class="err" id="pwErr">Wrong password. Try again.</p>
        <div class="row">
          <button id="cancelPw">Cancel</button>
          <button class="primary" id="submitPw">Sign in</button>
        </div>
      </div>
    </div>`;
  const ov = document.getElementById('ov');
  const pwInput = document.getElementById('pw');
  const err = document.getElementById('pwErr');
  pwInput.focus();
  ov.addEventListener('click', (e) => { if(e.target===ov) closeModal(); });
  document.getElementById('cancelPw').addEventListener('click', closeModal);
  function trySubmit(){
    if(pwInput.value === ADMIN_PASSWORD){
      isAdmin = true;
      adminFab.classList.add('on');
      closeModal();
      render(activeKey);
    } else {
      err.style.display = 'block';
    }
  }
  document.getElementById('submitPw').addEventListener('click', trySubmit);
  pwInput.addEventListener('keydown', (e) => { if(e.key==='Enter') trySubmit(); });
}

function openItemModal(catKey, index){
  const cat = DATA.find(c => c.key===catKey);
  const editing = index !== null;
  const rawItem = editing ? cat.items[index] : {no:'', title:'', w:['','','']};
  const norm = (rawItem.w||[]).map(e => (typeof e === 'string') ? {name:e, team:''} : e);
  while(norm.length < 3) norm.push({name:'', team:''});
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h4>${editing ? 'Edit program' : 'Add program'}</h4>
        <label for="fNo">No.</label>
        <input id="fNo" value="${rawItem.no}" />
        <label for="fTitle">Program title</label>
        <input id="fTitle" value="${rawItem.title}" />
        <label for="f1">1st place — name</label>
        <input id="f1" value="${norm[0].name||''}" />
        <label for="t1">1st place — team (optional)</label>
        <input id="t1" value="${norm[0].team||''}" />
        <label for="f2">2nd place — name</label>
        <input id="f2" value="${norm[1].name||''}" />
        <label for="t2">2nd place — team (optional)</label>
        <input id="t2" value="${norm[1].team||''}" />
        <label for="f3">3rd place — name</label>
        <input id="f3" value="${norm[2].name||''}" />
        <label for="t3">3rd place — team (optional)</label>
        <input id="t3" value="${norm[2].team||''}" />
        <p class="err" id="formErr">Enter a program title first.</p>
        <div class="row">
          <button id="cancelItem">Cancel</button>
          <button class="primary" id="saveItem">Save</button>
        </div>
      </div>
    </div>`;
  const ov = document.getElementById('ov');
  ov.addEventListener('click', (e) => { if(e.target===ov) closeModal(); });
  document.getElementById('cancelItem').addEventListener('click', closeModal);
  document.getElementById('saveItem').addEventListener('click', () => {
    const title = document.getElementById('fTitle').value.trim();
    const err = document.getElementById('formErr');
    if(!title){ err.style.display = 'block'; return; }
    const no = document.getElementById('fNo').value.trim() || '—';
    const w = [1,2,3].map(n => ({
      name: document.getElementById('f'+n).value.trim(),
      team: document.getElementById('t'+n).value.trim()
    })).filter(entry => entry.name);
    const newItem = { no, title, w };
    if(editing){
      cat.items[index] = newItem;
    } else {
      cat.items.push(newItem);
    }
    closeModal();
    buildTabs();
    render(catKey);
    saveData();
  });
}

function deleteItem(catKey, index){
  const cat = DATA.find(c => c.key===catKey);
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h4>Delete this program?</h4>
        <p style="font-size:13px;color:var(--ink);margin:0;">${cat.items[index].title}</p>
        <div class="row">
          <button id="cancelDel">Cancel</button>
          <button class="primary" id="confirmDel" style="background:var(--maroon);border-color:var(--maroon);">Delete</button>
        </div>
      </div>
    </div>`;
  const ov = document.getElementById('ov');
  ov.addEventListener('click', (e) => { if(e.target===ov) closeModal(); });
  document.getElementById('cancelDel').addEventListener('click', closeModal);
  document.getElementById('confirmDel').addEventListener('click', () => {
    cat.items.splice(index, 1);
    closeModal();
    buildTabs();
    render(catKey);
    saveData();
  });
}

adminFab.addEventListener('click', () => {
  if(isAdmin){
    isAdmin = false;
    adminFab.classList.remove('on');
    render(activeKey);
  } else {
    openPasswordModal();
  }
});

loadData();

const splashEl = document.getElementById('splash');
const mainAppEl = document.getElementById('mainApp');
const countEl = document.getElementById('splashCount');
const countNumEl = document.getElementById('splashCountNum');
let splashDismissed = false;
let countdownRunning = false;

function finishSplash(){
  splashEl.classList.add('hide');
  mainAppEl.classList.add('show');
}

function runCountdown(){
  if(countdownRunning || splashDismissed) return;
  countdownRunning = true;
  countEl.classList.add('on');
  let n = 3;
  countNumEl.textContent = n;
  const timer = setInterval(() => {
    n -= 1;
    if(n > 0){
      countNumEl.textContent = n;
      countNumEl.style.animation = 'none';
      void countNumEl.offsetWidth;
      countNumEl.style.animation = '';
    } else {
      clearInterval(timer);
      splashDismissed = true;
      finishSplash();
    }
  }, 1200);
}

splashEl.addEventListener('click', runCountdown);
setTimeout(() => { if(!countdownRunning) runCountdown(); }, 3600);
</script>

</body>
</html>
